<script>window._initialData={"autoOpenTwoPaneJobKey": "8e157da36d209c6c", "autoOpenTwoPaneViewjobResponse": {"status": "success", "body": {"jobKey": "8e157da36d209c6c", "jobCountry": "IN", "jobTitle": "Senior Software Engineer I, Insurance Services", "jobLocation": "Remote", "datePublished": null, "jobInfoWrapperModel": {"jobInfoModel": {"sanitizedJobDescription": "<div>\n <p>Porch Group is a leading vertical software and insurance platform and is positioned to be the best partner to help homebuyers move, maintain, and fully protect their homes. We offer differentiated products and services, with homeowners insurance at the center of this relationship. We differentiate and look to win in the massive and growing homeowners insurance opportunity by</p>\n <p></p>\n <p>1) providing the best services for homebuyers</p>\n <p>2) led by advantaged underwriting in insurance</p>\n <p>3) to protect the whole home</p>\n <p></p>\n <p>As a leader in the home services software-as-a-service (“SaaS”) space, we’ve built deep relationships with approximately 30 thousand companies that are key to the home-buying transaction, such as home inspectors, mortgage companies, and title companies.</p>\n <p>In 2020, Porch Group rang the Nasdaq bell and began trading under the ticker symbol PRCH. We are looking to build a truly great company and are JUST GETTING STARTED.</p>\n <p></p>\n <p>Job Title: <b>Senior </b><b>Software Engineer I </b><br>\n   Location: <b>India </b><br>\n   Workplace Type: <b>Remote </b></p>\n <p></p>\n <p><b>Job Summary </b></p>\n <p></p>\n <p>The future is bright for the Porch Group, and we’d love for you to be a part of it as our <b>Senior </b><b>Software Engineer I </b></p>\n <p></p>\n <p>We are seeking a highly skilled and experienced <b>Senior Software Engineer </b>to join the Insurance Services Engineering team. The ideal candidate will have a strong background in software development with a passion for solving complex problems, and some background in the Property &amp; Casualty technology space.</p>\n <p></p>\n <p><b>What You’ll Do As A Senior Software Engineer </b><b>I </b></p>\n <ul>\n  <li>Collaborate with engineers, product managers, and data scientists to develop and extract property attributes using regular expressions, large language models, or other techniques</li>\n  <li>Contribute to the development and maintenance of backend services with clean and well-tested code, learning Porch Engineering best practices</li>\n  <li>Participate in code reviews and technical discussions, seeking feedback and learning from more experienced team members</li>\n  <li>Take on well-defined tasks and complete them in a reasonable amount of time, communicating status and progress effectively within the team</li>\n  <li>Develop knowledge of the primary services and tools used by the team and learn how to navigate microservices architecture and cloud infrastructure</li>\n  <li>Follow established patterns and frameworks while developing your engineering judgment</li>\n </ul>\n <p></p>\n <p><b>What You Will Bring </b><b>As </b><b>A </b><b>Senior Software Engineer </b><b>I </b></p>\n <ul>\n  <li>Bachelor's or master's degree in computer science, engineering, or a related field ( or four years of equivalent work experience)</li>\n  <li>Experience: 5+ years of software development experience.</li>\n  <li>Technical experience: \n   <ul>\n    <li>Proficiency with SQL, preferably PostgreSQL</li>\n    <li>Production JVM language experience, preferably Scala</li>\n   </ul></li>\n  <li>Familiarity with data science concepts, data labeling, or information extraction</li>\n  <li>Exposure to concepts and terminology used in property inspections, real estate assessments, or home condition reporting</li>\n  <li>Exposure to containerization (Docker, Kubernetes), event-driven systems (Kafka), cloud platforms (AWS, GCP), or CI/CD pipelines</li>\n  <li>Exposure to Scala</li>\n  <li>Proven experience working with US based business teams.</li>\n  <li>Excellent written and communication skills in English language.</li>\n  <li>M ust currently reside in or are located within 150 km of Greater Delhi NCR, Greater Bangalore , or Greater Pune</li>\n  <li>Working Hours: 8 Hours (Excluding breaks) 4 Core US Hours Overlap (7:30pm– 11:30pm IST), 4 flexible hours (IST)</li>\n  <li>Workspace: A quiet space to work, an internet connection of at least 30 Mbps download | 10 Mbps upload</li>\n </ul>\n <p></p>\n <p>The application window for this position is anticipated to close in 2 weeks (10 business days) from September 15, 2026 . Please know this may change based on business and interviewing needs.</p>\n <p></p>\n <p><b>What You Will Get As A Porch Group Team Member </b></p>\n <p></p>\n <div>\n  <p>Pay Range* : 2,475,000 INR - 3,465,000 INR Annually</p>\n </div>\n <div>\n  <p><i>*Please know your actual pay at Porch will reflect </i><i>a number of </i><i>factors among which are your work experience and skillsets, </i><i>job-related knowledge, alignment with market and our Porch employees, as well as your geographic location. </i></p>\n </div>\n <ul>\n  <li>Our benefits package will provide you with comprehensive coverage for your health, life, and financial well-being.</li>\n  <li>Our benefits include medical insurance, accident insurance and retiral benefits.</li>\n  <li>Our wellness programs include 12 company-paid holidays, 2 flexible holidays, privilege/earned leave, casual/sick leave, paid maternity and paternity Leaves, and weekly wellness events.</li>\n </ul>\n <p></p>\n <p>#LI-PT1</p>\n <p>#LI-REMOTE</p>\n <p></p>\n <p><b>What’s next? </b></p>\n <p></p>\n <p>Submit your application below and our Talent Acquisition team will be reviewing your application shortly! If your resume gets us intrigued, we will look to connect with you for a chat to learn more about your background, and then possibly invite you to have virtual interviews. What's important to call out is that we want to make sure not only that you're the right person for us, but also that we're the right next step for you, so come prepared with all the questions you have!</p>\n <p></p>\n <p>Porch is committed to building an inclusive culture of belonging that not only embraces the diversity of our people but also reflects the diversity of the communities in which we work and the customers we serve. We know that the happiest and highest performing teams include people with diverse perspectives that encourage new ways of solving problems, so we strive to attract and develop talent from all backgrounds and create workplaces where everyone feels seen, heard and empowered to bring their full, authentic selves to work.</p>\n <p></p>\n <p>Porch is an Equal Opportunity employer. All qualified applicants will receive consideration for employment without regard to race, color, religion, sex including sexual orientation and gender identity, national origin, disability, protected veteran status, or any other characteristic protected by applicable laws, regulations, and ordinances.</p>\n</div>", "jobInfoHeaderModel": {"companyName": "Porch Group Media", "formattedLocation": "Remote", "jobTitle": "Senior Software Engineer I, Insurance Services"}, "jobDescriptionSectionModel": {"jobDetailsSection": {"isJobExpired": false}}, "structuredDataJobSummaryModel": {"salary": "₹24,75,000 - ₹34,65,000 a year", "jobTypeAndShiftSectionApp": {"jobType": ["Full-time"], "shiftAndSchedule": null}}}}}}};</script>
